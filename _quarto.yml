project:
  type: book
  output-dir: _book
  preview:
    port: 5896
    browser: true
#  render:
#    - "*.qmd"

book:
  title: "<span style='color:#0056B3'>Data Science Foundations and Machine Learning with R: From Data to Decisions</span>"
  author: "[<span style='color:#0056B3'>Reza Mohammadi</span>](https://www.uva.nl/profile/a.mohammadi)"
  date: today
  date-format: "D MMMM YYYY"
  reader-mode: true

  page-footer:
    left: |
      Data Science Foundations and Machine Learning with R was written by [<span style='color:#0056B3'>Reza Mohammadi</span>](https://www.uva.nl/profile/a.mohammadi).
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.

  search: true
  cover-image: images/logo.png
  favicon: images/logo.png
  site-url: https://book-data-science-r.netlify.app
  repo-url: https://github.com/RezaMoammadi/Book-Data-Science-R
  repo-branch: main
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  sharing: [linkedin, twitter, facebook]
  
  sidebar:
    search: true
    style: docked
    background: light

  chapters:
    - index.qmd
    - 0-preface.qmd
    - 1-intro-data-science.qmd
    - 2-data-understanding-eda.qmd
    - 3-data-preperation.qmd
    - 4-classification-knn.qmd
    - 5-model-evaluation.qmd
    - 6-naive-bayes.qmd
    - 7-statistical-inference.qmd
    - 8-regression.qmd
    - 9-generalized-regression.qmd
    - 10-tree-based-models.qmd
    - 11-neural-networks.qmd
    - 12-clustering.qmd
    - 13-references.qmd

  appendices:
    - Appendix-r-foundations.qmd

crossref:
  appendix-title: "Appendix"
  appendix-delim: ":"
    
bibliography: [references.bib, packages.bib]
csl: chicago-author-date.csl

format:
  html:
    number-sections: true
    toc: true
    theme:
      - cosmo
      - r4ds.scss
    code-fold: false
    code-link: true
    author-meta: "Reza Mohammadi"
    include-in-header: "plausible.html"
    theorem-environments:
      - name: example
        title: "Example"
        numbered: true
        counter-depth: 2
 
  pdf:
    pdf-engine: xelatex # or lualatex
    documentclass: svmono
    mainfont: "Palatino"
    monofont: "Inconsolata"
    code-block: true
    code-block-font-size: 7pt
    include-in-header: template.tex
    number-sections: true
    toc: true
    keep-tex: true
    theorem-environments:
      - name: example
        title: "Example"
        numbered: true
        counter-depth: 2
    callout-definitions:
      example:
        title: "Example"
        color: "gray!10"

editor: visual

